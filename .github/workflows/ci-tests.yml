# Build and test on Windows (Release + Debug).
#
#   - Release: unit + integration tests, then the perf tests (non-blocking:
#     shared runners are too noisy to gate on timing).
#   - Debug:   unit + integration tests, plus an OpenCppCoverage report
#     uploaded as an artifact.
#
# The product is Windows-only for now (Win32 + Direct3D 11 desktop app,
# DPAPI-protected trial store), so there is no Linux job. The model
# library itself is portable C++20; a Linux job is worth adding once the
# GUI and licensing pieces are split out of the core library.
#
# No CUDA toolkit is needed: GPU kernels are an optional, experimental
# part of the build (NEUROGRAPH_ENABLE_CUDA, off by default).
#
# Dependencies come from vcpkg in manifest mode. vcpkg.json pins a real
# vcpkg release (builtin-baseline) and the exact package versions used
# for local development, so CI builds against the same libraries.

name: ci-tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "tests/manual/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "tests/manual/**"
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Tests (windows-2022 / ${{ matrix.config }})
    runs-on: windows-2022
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]

    env:
      # Built packages are cached between runs in a plain folder that
      # actions/cache saves and restores (vcpkg's former x-gha provider
      # no longer exists).
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild (VS 2022)
        uses: microsoft/setup-msbuild@v2

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-bin-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-bin-windows-

      - name: Create vcpkg binary cache folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg-binary-cache" | Out-Null

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # vcpkg release 2026.10.16, the same commit as the
          # builtin-baseline in vcpkg.json.
          vcpkgGitCommitId: "9eec002df1cd109f8f104cd966a763daf9751489"

      - name: Install OpenCppCoverage (Debug only)
        if: matrix.config == 'Debug'
        shell: pwsh
        run: |
          choco install opencppcoverage --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "opencppcoverage install failed" }
          "C:\Program Files\OpenCppCoverage" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: pwsh
        run: |
          $covFlag = if ("${{ matrix.config }}" -eq "Debug") { "ON" } else { "OFF" }
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DNEUROGRAPH_BUILD_TESTS=ON `
            -DNEUROGRAPH_ENABLE_COVERAGE=$covFlag
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

      - name: Build tests and tools
        shell: pwsh
        run: |
          cmake --build build --config ${{ matrix.config }} --parallel `
            --target neurograph_tests --target neurograph_train `
            --target neurograph_predict --target neurograph_rt
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Build neurograph_perf and the workbench (Release only)
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel `
            --target neurograph_perf --target neurograph_workbench
          if ($LASTEXITCODE -ne 0) { throw "perf/workbench build failed" }

      - name: Run unit + integration tests
        shell: pwsh
        run: |
          ctest --test-dir build -C ${{ matrix.config }} `
                --output-on-failure --label-exclude perf `
                --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "ctest failed" }

      - name: Run perf tests (Release only, non-blocking)
        if: matrix.config == 'Release'
        shell: pwsh
        env:
          NEUROGRAPH_PERF_SKIP_GATE: "1"
        run: |
          ctest --test-dir build -C Release `
                --output-on-failure --label perf
          exit 0

      - name: Run coverage (Debug only)
        if: matrix.config == 'Debug'
        shell: pwsh
        run: |
          cmake --build build --config Debug `
                --target neurograph_coverage
          if ($LASTEXITCODE -ne 0) {
            throw "coverage run failed (is OpenCppCoverage on PATH?)"
          }

      - name: Upload coverage artifact (Debug only)
        if: matrix.config == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura-windows-debug
          path: |
            build/coverage/cobertura.xml
            build/coverage/html/**
          if-no-files-found: error
          retention-days: 14
